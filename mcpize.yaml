version: 1
name: adops-mcp
description: "AI-powered cross-platform ad management. Manage Google Ads and Meta Ads campaigns, analyze performance, optimize budgets, detect anomalies, run A/B tests, and forecast spend."
runtime: typescript
entry: src/index.ts

build:
  install: npm ci
  command: npm run build

startCommand:
  type: http
  command: node dist/index.js
  env:
    MCPIZE: "true"
    PORT: "8080"

secrets:
  - name: LEMONSQUEEZY_LICENSE_KEY
    required: false
    description: "LemonSqueezy Pro license key — unlocks Pro tier (Free tier without it)"

  # v1.4 roadmap (BYOK) — not yet read by the server.
  # Reserved for a future live-sync integration. Current release uses CSV import.
  - name: GOOGLE_ADS_DEVELOPER_TOKEN
    required: false
    description: "[v1.4 roadmap — not yet read] Google Ads API developer token"
  - name: GOOGLE_ADS_CLIENT_ID
    required: false
    description: "[v1.4 roadmap — not yet read] Google Ads OAuth2 client ID"
  - name: GOOGLE_ADS_CLIENT_SECRET
    required: false
    description: "[v1.4 roadmap — not yet read] Google Ads OAuth2 client secret"
  - name: GOOGLE_ADS_REFRESH_TOKEN
    required: false
    description: "[v1.4 roadmap — not yet read] Google Ads OAuth2 refresh token"

credentials:
  # v1.4 roadmap (BYOK) — not yet read by the server.
  - name: META_APP_ID
    required: false
    description: "[v1.4 roadmap — not yet read] Meta Marketing API App ID"
  - name: META_APP_SECRET
    required: false
    description: "[v1.4 roadmap — not yet read] Meta Marketing API App Secret"
  - name: META_ACCESS_TOKEN
    required: false
    description: "[v1.4 roadmap — not yet read] Meta system user access token"
